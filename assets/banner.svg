<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyanGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 58px; fill: url(#textGrad); letter-spacing: -1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 21px; fill: #94a3b8; letter-spacing: -0.2px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .pill-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    .pill-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="1196" height="356" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Effects -->
  <rect x="2" y="2" width="1196" height="356" rx="20" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="1196" height="356" rx="20" fill="url(#purpleGlow)" />

  <!-- Decorative Grid Overlay -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1120" y1="0" x2="1120" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Logo Mark (Tab & Lightning/Agent Icon) -->
  <g transform="translate(80, 52)">
    <rect width="64" height="64" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Browser Tab Base -->
    <path d="M16 22 C16 19, 18 17, 21 17 L35 17 C37 17, 39 19, 41 21 L44 25 L48 25 C50.5 25, 52 26.5, 52 29 L52 45 C52 47.5, 50.5 49, 48 49 L16 49 Z" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" />
    <!-- Glowing Node Pulse -->
    <circle cx="34" cy="36" r="5" fill="#38bdf8" />
    <circle cx="34" cy="36" r="9" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
  </g>

  <!-- Header Typography -->
  <text x="160" y="98" class="title">OpenTabs Plugins</text>
  <text x="80" y="152" class="subtitle">Browser-authenticated MCP tools for AI agents — zero API keys, live session context.</text>

  <!-- Badges Row -->
  <g transform="translate(80, 182)">
    <!-- Badge 1: 4 Plugins -->
    <g transform="translate(0, 0)">
      <rect width="130" height="28" rx="14" fill="url(#badgeBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8" />
      <text x="26" y="19" class="badge-text">4 Plugins</text>
    </g>

    <!-- Badge 2: 20 Tools -->
    <g transform="translate(142, 0)">
      <rect width="130" height="28" rx="14" fill="url(#badgeBg)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#818cf8" />
      <text x="26" y="19" class="badge-text">20 MCP Tools</text>
    </g>

    <!-- Badge 3: Zero API Keys -->
    <g transform="translate(284, 0)">
      <rect width="150" height="28" rx="14" fill="url(#badgeBg)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#a855f7" />
      <text x="26" y="19" class="badge-text">Zero API Keys</text>
    </g>

    <!-- Badge 4: Trusted Types Safe -->
    <g transform="translate(446, 0)">
      <rect width="180" height="28" rx="14" fill="url(#badgeBg)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <text x="26" y="19" class="badge-text">Trusted Types Safe</text>
    </g>

    <!-- Badge 5: MIT Licensed -->
    <g transform="translate(638, 0)">
      <rect width="130" height="28" rx="14" fill="url(#badgeBg)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#f59e0b" />
      <text x="26" y="19" class="badge-text">MIT License</text>
    </g>
  </g>

  <!-- Plugin Cards Bottom Bar -->
  <g transform="translate(80, 240)">
    <!-- Card 1: Facebook -->
    <g transform="translate(0, 0)">
      <rect width="245" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="15" width="44" height="44" rx="10" fill="#1877f2" fill-opacity="0.15" stroke="#1877f2" stroke-opacity="0.4" />
      <!-- Social Icon -->
      <path d="M34 25 C31 25 29 27 29 30 L29 33 L26 33 L26 37 L29 37 L29 47 L34 47 L34 37 L38 37 L39 33 L34 33 L34 31 C34 30 35 29 36 29 L39 29 L39 25 Z" fill="#3b82f6" />
      <text x="66" y="38" class="pill-title">fb-friends-manager</text>
      <text x="66" y="54" class="pill-sub">Triage · 6 tools</text>
    </g>

    <!-- Card 2: Greenhouse -->
    <g transform="translate(262, 0)">
      <rect width="245" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="15" width="44" height="44" rx="10" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-opacity="0.4" />
      <!-- Doc / Form Icon -->
      <path d="M28 25 L40 25 L44 29 L44 47 L28 47 Z" fill="none" stroke="#10b981" stroke-width="1.5" />
      <line x1="32" y1="33" x2="38" y2="33" stroke="#10b981" stroke-width="1.5" />
      <line x1="32" y1="38" x2="40" y2="38" stroke="#10b981" stroke-width="1.5" />
      <text x="66" y="38" class="pill-title">greenhouse</text>
      <text x="66" y="54" class="pill-sub">Apply Form · 3 tools</text>
    </g>

    <!-- Card 3: Toptal -->
    <g transform="translate(524, 0)">
      <rect width="245" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="15" width="44" height="44" rx="10" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-opacity="0.4" />
      <!-- User / Star Icon -->
      <path d="M34 25 L36 30 L41 31 L37 35 L38 40 L34 37 L30 40 L31 35 L27 31 L32 30 Z" fill="#60a5fa" />
      <text x="66" y="38" class="pill-title">toptal</text>
      <text x="66" y="54" class="pill-sub">Talent Portal · 7 tools</text>
    </g>

    <!-- Card 4: Upwork -->
    <g transform="translate(786, 0)">
      <rect width="245" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <rect x="12" y="15" width="44" height="44" rx="10" fill="#14a800" fill-opacity="0.15" stroke="#14a800" stroke-opacity="0.4" />
      <!-- Briefcase Icon -->
      <rect x="27" y="30" width="16" height="13" rx="2" fill="none" stroke="#22c55e" stroke-width="1.5" />
      <path d="M31 30 L31 27 C31 26 32 25 33 25 L37 25 C38 25 39 26 39 27 L39 30" fill="none" stroke="#22c55e" stroke-width="1.5" />
      <text x="66" y="38" class="pill-title">upwork</text>
      <text x="66" y="54" class="pill-sub">Profile Edit · 4 tools</text>
    </g>
  </g>
</svg>
